[package]
name = "datafake-rs"
version = "0.2.2"
edition = "2024"
authors = ["Plasmatic Engineering <shankar@goplasmatic.io>"]
description = "High-performance JSON mock data generation using JSONLogic configuration"
documentation = "https://docs.rs/datafake-rs"
homepage = "https://github.com/GoPlasmatic/datafake-rs"
repository = "https://github.com/GoPlasmatic/datafake-rs"
license = "Apache-2.0"
readme = "README.md"
keywords = ["fake", "data", "json", "jsonlogic", "mock"]
categories = [
    "data-structures",
    "development-tools::testing",
    "web-programming",
]
exclude = [".github/*", ".gitignore", "CONTRIBUTING.md"]

[dependencies]
datalogic-rs = "4.0"
# Only enable uuid feature - we don't use derive macros or chrono integration from fake
fake = { version = "4.4", default-features = false, features = ["uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rand = "0.9"
# Only enable clock (for Utc::now) and std - we don't serialize chrono types
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lib]
name = "datafake_rs"
path = "src/lib.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
uuid = { version = "1.0", features = ["js"] }

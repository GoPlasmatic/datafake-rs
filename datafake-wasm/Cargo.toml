[package]
name = "datafake-wasm"
version = "0.1.0"
edition = "2024"
authors = ["Plasmatic Engineering <shankar@goplasmatic.io>"]
description = "WebAssembly bindings for datafake-rs fake data generator"
license = "Apache-2.0"
repository = "https://github.com/GoPlasmatic/datafake-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
datafake-rs = { path = ".." }
wasm-bindgen = "0.2"
serde_json = "1.0"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
